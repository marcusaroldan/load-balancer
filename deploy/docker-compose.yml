# lbdemo — load-balancer + simulator/dashboard demo project
#
# Layout: place this file in its own directory with the repo cloned as a
# sibling named load-balancer, e.g.
#
#   <some-dir>/docker-compose.yml     (this file)
#   <some-dir>/load-balancer/         (git clone of the repo)
#
# Building straight from a repo checkout instead:
#   LB_REPO_DIR=. docker compose -f deploy/docker-compose.yml up -d --build
#
# Publish rules: ONLY the dashboard is published, and only on loopback —
# a reverse proxy or tunnel (separate concern) is what reaches
# 127.0.0.1:${DASHBOARD_PORT}. The load balancer's data plane (9000) and
# control plane (8082) stay on the private network, unreachable from the
# host, let alone the internet.
#
# Start/verify:
#   docker compose up -d --build
#   curl -s http://127.0.0.1:8090/healthz        # dashboard alive
#   docker compose ps                            # both "healthy"
#   open http://127.0.0.1:8090                   # scenario UI
#   Scale to zero: close the tab; after IDLE_TIMEOUT every backend is
#   deregistered from the live LB (data plane answers 503 until reopened).

name: lbdemo

services:
  lb:
    build:
      context: ${LB_REPO_DIR:-load-balancer}
      dockerfile: Dockerfile
      target: loadbalancer
    image: lbdemo-lb:local
    command:
      - -data
      - ":9000"
      - -control
      - ":8082"
      # Control binds the compose bridge (dashboard must reach it); it is
      # never published. -expose-control is the deliberate opt-in required
      # by the PROD-009 loopback guard.
      - -expose-control
      - -health-interval
      - 2s
    networks: [lb-demo]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "/loadbalancer", "-healthcheck", "http://127.0.0.1:8082/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  dashboard:
    build:
      context: ${LB_REPO_DIR:-load-balancer}
      dockerfile: Dockerfile
      target: simulator
    image: lbdemo-dashboard:local
    command:
      - -port
      - "8081"
      - -static
      - /web
      # Simulated backends bind the container's routable interface and
      # advertise their service DNS name, so the separate lb container
      # can dial them (S1/BackendBinding policy).
      - -backend-bind
      - 0.0.0.0
      - -backend-advertise
      - dashboard
      # Drive the REAL out-of-process service (B6).
      - -lb-control
      - http://lb:8082
      - -lb-data
      - http://lb:9000
      # S2: with no open dashboard tab for this long, deregister every
      # backend and stop synthetic traffic.
      - -idle-timeout
      - ${IDLE_TIMEOUT:-10m}
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8090}:8081"
    depends_on:
      lb:
        condition: service_healthy
    networks: [lb-demo]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "/simulator", "-healthcheck", "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  lb-demo:
    driver: bridge
