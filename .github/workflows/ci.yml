name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: test -z "$(gofmt -l internal cmd)"
      - run: go test ./... -count=1
      - run: go test -race ./... -count=1

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # BuildKit is the docker default on ubuntu-latest; both targets build
      # from the same stage. Nothing is pushed -- this job proves the
      # shippable artifacts exist and stay within the size budget.
      - name: Build loadbalancer image
        run: docker build --target loadbalancer -t lbdemo-lb .
      - name: Build simulator image
        run: docker build --target simulator -t lbdemo-dashboard .
      - name: Enforce <25MB image budget
        run: |
          for img in lbdemo-lb lbdemo-dashboard; do
            size=$(docker image inspect "$img" --format '{{.Size}}')
            echo "$img: $((size / 1000000)) MB"
            [ "$size" -lt 25000000 ] || { echo "OVER BUDGET: $img"; exit 1; }
          done
      - name: Scratch image actually runs
        run: |
          docker run --rm lbdemo-lb -version
      - name: Validate compose project
        run: docker compose -f deploy/docker-compose.yml config -q
